<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="utf-8"/>
        <meta name="keywords" content="Baidu Maps, Baidu Maps API, Baidu Maps Custom Tools, Baidu Maps WYSIWYG Tool"/>
        <meta name="description" content="A custom map built with the Baidu Maps API."/>
        <title>Baidu Maps API Custom Map</title>
        <!-- Load the Baidu Maps API. -->
        <style type="text/css">
            html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    
    <script type="text/javascript" src="http://api.map.baidu.com/api?key=&v=2.0&ak=6b6c1a67eaa7db1ca6d6da28e590e343&services=true"></script>
</head>

<body onload="initMap();">
<!-- Baidu map container. -->
<div style="width:697px;height:550px;border:#ccc solid 1px;" id="dituContent"></div>
</body>
<script type="text/javascript">
    function getParam(name) {
        return location.href.match(new RegExp('[?#&]' + name + '=([^?#&]+)', 'i')) ? RegExp.$1 : '';
    }
    var map, marker;
    var centerParam = getParam('center');
    var zoomParam = getParam('zoom');
    var widthParam = getParam('width');
    var heightParam = getParam('height');
    var markersParam = getParam('markers');
    var markerStylesParam = getParam('markerStyles');
    var iframe = getSelfIframe();
    var UM = parent.UM;
    var editor = getEditor();

    // Create and initialize the map.
    function initMap() {
        // In Firefox, the map API may be unavailable after switching editor modes.
        if (!window.BMap) {
            return;
        }
        var dituContent = document.getElementById('dituContent');
        dituContent.style.width = widthParam + 'px';
        dituContent.style.height = heightParam + 'px';

        createMap();// Create the map.
        setMapEvent();// Configure map interactions.
        addMapControl();// Add map controls.

        // Create the map marker.
        var markersArr = markersParam.split(',');
        var point = new BMap.Point(markersArr[0], markersArr[1]);
        marker = new BMap.Marker(point);
        marker.enableDragging();
        map.addOverlay(marker); // Add the marker to the map.

        if(iframe && UM && editor) { // Keep the embedded map synchronized while editing.
            setMapListener();// Update the containing iframe URL when the map changes.
        } else {
            document.focus();
        }
    }

    // Create the map at the requested center and zoom level.
    function createMap() {
        map = new BMap.Map("dituContent");// Create a map in the Baidu map container.
        var centerArr = centerParam.split(',');
        var point = new BMap.Point(parseFloat(centerArr[0]), parseFloat(centerArr[1]));// Set the center coordinates.
        map.centerAndZoom(point, parseInt(zoomParam));// Display the map at the requested center and zoom level.
    }

    // Enable map interactions.
    function setMapEvent() {
        map.enableDragging();// Allow the map to be dragged.
        map.enableScrollWheelZoom();// Allow zooming with the mouse wheel.
        map.enableDoubleClickZoom();// Allow zooming by double-clicking.
        map.enableKeyboard();// Allow the arrow keys to move the map.
    }

    // Add navigation, overview, and scale controls.
    function addMapControl() {
        // Add navigation controls to the map.
        var ctrl_nav = new BMap.NavigationControl({anchor: BMAP_ANCHOR_TOP_LEFT, type: BMAP_NAVIGATION_CONTROL_LARGE});
        map.addControl(ctrl_nav);
        // Add an overview map control.
        var ctrl_ove = new BMap.OverviewMapControl({anchor: BMAP_ANCHOR_BOTTOM_RIGHT, isOpen: 1});
        map.addControl(ctrl_ove);
        // Add a scale control to the map
        var ctrl_sca = new BMap.ScaleControl({anchor: BMAP_ANCHOR_BOTTOM_LEFT});
        map.addControl(ctrl_sca);
    }

    function setMapListener() {
        var timer;

        map.addEventListener('moveend', mapListenerHandler);
        map.addEventListener('zoomend', mapListenerHandler);
        marker.addEventListener('dragend', mapListenerHandler);

        function mapListenerHandler() {
            var zoom = map.getZoom(),
                center = map.getCenter(),
                marker = window.marker.P;

            iframe.src = iframe.src.
                replace(new RegExp('([?#&])center=([^?#&]+)', 'i'), '$1center=' + center.lng + ',' + center.lat).
                replace(new RegExp('([?#&])markers=([^?#&]+)', 'i'), '$1markers=' + marker.lng + ',' + marker.lat).
                replace(new RegExp('([?#&])zoom=([^?#&]+)', 'i'), '$1zoom=' + zoom);
            editor.fireEvent('saveScene');
            saveScene(editor);
        }

        function saveScene(){
            if(!timer) {
                timer = setTimeout(function(){
                    editor.fireEvent('savescene');
                    editor.fireEvent('contentchange');
                    timer = null;
                }, 1000);
            }
        }
    }

    function getSelfIframe(){
        var iframes = parent.document.getElementsByTagName('iframe');
        for (var key in iframes) {
            if (iframes[key].contentWindow == window) {
                return iframes[key];
            }
        }
        return null;
    }

    function getEditor(){
        var parentNode = iframe.parentNode;
        while (parentNode && parentNode.tagName && parentNode.tagName.toLowerCase() != 'body') {
            if (parentNode.className && parentNode.className.indexOf('edui-body-container')!=-1) {
                return UM.getEditor(parentNode.id);
            }
            parentNode = parentNode.parentNode;
        }
        return null;
    }
</script>
</html>
