<!DOCTYPE html>
<html>
<head>
	<title>IVA HTML5 {:lang_web('string_bfq')}</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
	<style type="text/css">
	html,body{height:100%; padding:0; margin:0;}
	#playerCnt{width:100%;height:100%;margin:0 auto;background-origin:content-box;background-size:cover;}
	</style>
	<link rel="stylesheet" href="/static/player/dplayer/DPlayer.min.css">
	<script type="text/javascript" src="/static/player/dplayer/hls.min.js"></script>
	<script type="text/javascript" src="/static/player/dplayer/DPlayer.min.js?v=1.27.1"></script>
</head>
<body>
<div id="playerCnt"></div>
<script type="text/javascript">
	function GetQS(name)
	{
		var reg = new RegExp("(^|&)"+ name +"=([^&]*)(&|$)");
		var r = window.location.search.substr(1).match(reg);
		if (r!=null) return decodeURIComponent(r[2]); return ''; 
	}
	
	var playfrom = GetQS('f');
	var playurl = GetQS('u');
	var ivaInstance = new DPlayer({
		container: document.getElementById('playerCnt'),
		autoplay: true,
		video: { url: playurl, type: playurl.indexOf('.m3u8') > -1 ? 'hls' : 'auto' }
	});
	try{
		document.getElementById('playerCnt').style.height = parent.MacPlayer.Height + 'px';
	}
	catch(e){}
</script>
</body>
</html>
