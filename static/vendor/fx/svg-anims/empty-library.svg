<g class="k0" transform="translate(120 122)"><g class="bob"><rect class="card" x="-48" y="-35" width="96" height="70" rx="14"/><path class="perf" d="M-34-28h8v6h-8zM-19-28h8v6h-8zM-4-28h8v6h-8zM11-28h8v6h-8zM26-28h8v6h-8zM-34 22h8v6h-8zM-19 22h8v6h-8zM-4 22h8v6h-8zM11 22h8v6h-8zM26 22h8v6h-8z"/>
<circle class="ring" r="20"/><g class="play"><circle class="btn" r="20"/><path class="tri" d="M-7-11L12 0L-7 11Z"/></g></g></g>
