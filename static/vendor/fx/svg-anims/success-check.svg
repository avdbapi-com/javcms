<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" class="fxsvg fxsvg-ok" aria-hidden="true" focusable="false">
<!-- JavCMS fx | original animation, JavCMS Community License 1.0 | plays once; replay by re-inserting the node | colours: CSS custom properties fx-accent, fx-accent-2, fx-ink (two leading hyphens; fallbacks in the style rules) -->
<style>
.fxsvg-ok .ring{fill:none;stroke:var(--fx-accent-2,#7c5cff);stroke-width:6;stroke-linecap:round;stroke-dasharray:371;stroke-dashoffset:371;transform-origin:120px 120px;transform:rotate(-90deg);animation:fxsvg-ok-draw .6s cubic-bezier(.16,1,.3,1) forwards}
.fxsvg-ok .disc{fill:var(--fx-accent,#ff3d81);transform-origin:120px 120px;transform:scale(0);animation:fxsvg-ok-pop .5s cubic-bezier(.34,1.56,.64,1) .05s forwards}
.fxsvg-ok .check{fill:none;stroke:var(--fx-ink,#e6e8f0);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:62;stroke-dashoffset:62;animation:fxsvg-ok-draw .4s cubic-bezier(.16,1,.3,1) .45s forwards}
@keyframes fxsvg-ok-draw{to{stroke-dashoffset:0}}
@keyframes fxsvg-ok-pop{to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.fxsvg-ok .ring,.fxsvg-ok .check{animation:none;stroke-dashoffset:0}.fxsvg-ok .disc{animation:none;transform:none}}
</style>
<circle class="ring" cx="120" cy="120" r="59"/>
<circle class="disc" cx="120" cy="120" r="46"/>
<path class="check" d="M100 122l14 14 28-30"/>
</svg>
