<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" class="fxsvg fxsvg-heart" aria-hidden="true" focusable="false">
<!-- JavCMS fx | original animation, JavCMS Community License 1.0 | plays once; replay by re-inserting the node | colours: CSS custom properties fx-accent, fx-accent-2 (two leading hyphens; fallbacks in the style rules) -->
<style>
.fxsvg-heart .heart{fill:var(--fx-accent,#ff3d81);transform-origin:120px 112px;transform:scale(0);animation:fxsvg-heart-pop .6s cubic-bezier(.34,1.56,.64,1) forwards}
.fxsvg-heart .ring{fill:none;stroke:var(--fx-accent-2,#7c5cff);stroke-width:18;transform-origin:120px 120px;transform:scale(.1);animation:fxsvg-heart-ring .45s cubic-bezier(.16,1,.3,1) forwards}
.fxsvg-heart .p{transform-origin:120px 120px;transform:rotate(var(--a)) translateY(0) scale(0);animation:fxsvg-heart-fly .75s cubic-bezier(.16,1,.3,1) .12s forwards}
.fxsvg-heart .p circle{fill:var(--fx-accent,#ff3d81)}.fxsvg-heart .p:nth-child(even) circle{fill:var(--fx-accent-2,#7c5cff)}
@keyframes fxsvg-heart-pop{0%{transform:scale(0)}55%{transform:scale(1.25)}75%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes fxsvg-heart-ring{0%{transform:scale(.1);stroke-width:18;opacity:1}85%{opacity:1}100%{transform:scale(1.9);stroke-width:.1;opacity:0}}
@keyframes fxsvg-heart-fly{0%{transform:rotate(var(--a)) translateY(0) scale(0)}25%{transform:rotate(var(--a)) translateY(-30px) scale(1)}70%{transform:rotate(var(--a)) translateY(-66px) scale(1)}100%{transform:rotate(var(--a)) translateY(-72px) scale(0)}}
@media (prefers-reduced-motion:reduce){.fxsvg-heart .heart{animation:none;transform:none}.fxsvg-heart .ring,.fxsvg-heart .p{animation:none;opacity:0}}
</style>
<circle class="ring" cx="120" cy="120" r="40"/>
<g><g class="p" style="--a:0deg"><circle cx="120" cy="120" r="5"/></g><g class="p" style="--a:45deg"><circle cx="120" cy="120" r="5"/></g><g class="p" style="--a:90deg"><circle cx="120" cy="120" r="5"/></g><g class="p" style="--a:135deg"><circle cx="120" cy="120" r="5"/></g><g class="p" style="--a:180deg"><circle cx="120" cy="120" r="5"/></g><g class="p" style="--a:225deg"><circle cx="120" cy="120" r="5"/></g><g class="p" style="--a:270deg"><circle cx="120" cy="120" r="5"/></g><g class="p" style="--a:315deg"><circle cx="120" cy="120" r="5"/></g></g>
<path class="heart" d="M120 101.6C112.2 83.4 81 86 81 109.4C81 127.6 104.4 138 120 151C135.6 138 159 127.6 159 109.4C159 86 127.8 83.4 120 101.6Z"/>
</svg>
