name: Feature request
description: Suggest an idea or an improvement for JavCMS.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. One idea per request makes it easier to discuss and plan.
        Please check the [open requests](https://github.com/avdbapi-com/javcms/issues?q=is%3Aissue+label%3Aenhancement) first.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Themes
        - Imports (AVDB, xvidapi)
        - Ads
        - SEO
        - Speed and protection
        - Admin panel
        - Installer and upgrade
        - Languages
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today? Who runs into it?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should JavCMS solve it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: What do you do today instead?
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing requests.
          required: true
        - label: This request is safe for work (no adult wording or imagery).
          required: true
