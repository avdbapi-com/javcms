# Rendered from deployment/nginx/locations.conf.example; no generic PHP handler.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 40m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name _;
        root /var/www/javcms;
        # Inside ONE server block; replace tokens using render-profile.py.
        # Remove competing panel location / and generic PHP locations. Keep TLS/logs/pool.
        index index.php;
        autoindex off;
        
        # Must precede the PHP handler and panel static regex locations.
        location ~* ^/(?:application|runtime|vendor|thinkphp|extend|deployment|backup|backups)(?:/|$) { return 403; }
        location ~* ^/template/[^/]+/html(?:/|$) { return 403; }
        location ~ (^|/)\.(?!well-known(?:/|$)) { return 403; }
        location ~* ^/\.well-known/(?!acme-challenge/) { return 403; }
        location ~* \.(?:ini|log|sql|sqlite|bak|conf|ya?ml)(?:/|$) { return 403; }
        location ~* ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|README(?:\.[^/]+)?|LICENSE(?:\.[^/]+)?|NOTICE(?:\.[^/]+)?|[^/]+\.(?:zip|gz|7z|tar))(?:/|$) { return 403; }
        location ~* (?:^|/)web\.config$ { return 403; }
        location ~* ^/upload/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|asp|aspx|jsp|sh)(?:[./]|$) { return 403; }
        
        location ~ ^/(?<javcms_script>index\.php|api\.php|javcms\.php|install\.php)(?<javcms_path_info>/.*)?$ {
            # Exact SCRIPT_FILENAME excludes path suffixes; only real entry files run.
            # Store named captures before try_files: its URI handling may clear captures.
            set $javcms_saved_script $javcms_script;
            set $javcms_saved_path $javcms_path_info;
            try_files /$javcms_saved_script =404;
            include /etc/nginx/javcms/nginx/fastcgi-params.conf;
            fastcgi_param SCRIPT_FILENAME /var/www/javcms/$javcms_saved_script;
            fastcgi_param SCRIPT_NAME /$javcms_saved_script;
            fastcgi_param PATH_INFO $javcms_saved_path;
            fastcgi_pass php:9000;
        }
        location ~* \.(?:php[0-9]?|phtml|phar)(?:[./]|$) { return 403; }
        # robots.txt is generated per site (Sitemap line for the configured domain); a root robots.txt only adds custom rules.
        location = /robots.txt { rewrite ^ /index.php?s=/robots.txt last; }
        location / {
            # Static files only: compress text assets, including the image/svg+xml auto-icon sprites.
            # Browsers must not guess another type for static files (PHP pages send this header themselves).
            add_header X-Content-Type-Options "nosniff" always;
            gzip on;
            gzip_vary on;
            gzip_comp_level 5;
            gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
            try_files $uri $uri/ @javcms_front;
        }
        location @javcms_front {
            # Existing query parameters, bodies, and HTTP methods remain intact.
            rewrite ^/(.*)$ /index.php?s=/$1 last;
        }
    }
}
